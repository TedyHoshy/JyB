<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mini Mercado & Carnicería J & B</title>
  <link rel="icon" href="../img/Logo.png" type="image/png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

  <div class="login-container">
    <img src="img/logo.png" alt="Logo J & B" class="logo">
    <h2>Iniciar Sesión</h2>

    <form id="login-form">
      <label for="correo">Correo:</label>
      <input type="email" id="correo" name="correo" placeholder="Ingrese su correo" required>

      <label for="clave">Contraseña:</label>
      <input type="password" id="clave" name="clave" placeholder="Ingrese su contraseña" required>

      <button type="submit">Iniciar Sesión</button>
    </form>

    <p class="mensaje" id="mensaje"></p>

    <!-- Enlace al registro -->
    <p style="margin-top: 25px; font-size: 14px; color: #555;">
      ¿No tienes cuenta? 
      <a href="registro.html" style="color:#c0392b; font-weight:bold; text-decoration:none;">
        Regístrate aquí
      </a>
    </p>
    
  </div> 

  <script src="js/login.js"></script>
  <script src="./js/config.js"></script>
</body>
</html>
